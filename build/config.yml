version: '3'

info:
  companyName: "pmanage"
  productName: "pmanage"
  productIdentifier: "com.pmanage.app"
  description: "GPU / NPU / TPU process viewer and manager"
  copyright: "© 2026, pmanage"
  comments: "One-stop accelerator process management desktop application"
  version: "0.2.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - pkg
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations: []
other: []
