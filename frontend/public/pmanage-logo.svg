<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="pmanage logo">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#0a0a0d"/>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="url(#pg)" stroke-opacity=".35" stroke-width="1.4"/>
  <!-- activity/pulse line -->
  <path d="M10 36 h10 l3 -9 5 18 4 -12 3 6 h4 l3 -9 5 18 3 -9 h4" fill="none" stroke="url(#pg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 3 device bars: GPU / NPU / TPU -->
  <rect x="11" y="20" width="5" height="4" rx="1" fill="#38bdf8" opacity=".8"/>
  <rect x="18" y="20" width="5" height="7" rx="1" fill="#22c55e" opacity=".8"/>
  <rect x="25" y="20" width="5" height="3" rx="1" fill="#a78bfa" opacity=".8"/>
</svg>
